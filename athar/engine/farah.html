<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Ruqaa";font-weight:700;src:url(../fonts/ArefRuqaa-Bold.ttf)}
@font-face{font-family:"Ruqaa";font-weight:400;src:url(../fonts/ArefRuqaa-Regular.ttf)}
@font-face{font-family:"Amiri";font-weight:400;src:url(../fonts/amiri-arabic-400-normal.woff2)}
@font-face{font-family:"Tajawal";font-weight:500;src:url(../fonts/Tajawal-Medium.ttf)}
@font-face{font-family:"Cormorant";font-weight:500;font-style:italic;src:url(../fonts/CormorantGaramond-MediumItalic.ttf)}
@font-face{font-family:"Cormorant";font-weight:600;font-style:italic;src:url(../fonts/CormorantGaramond-SemiBoldItalic.ttf)}
@font-face{font-family:"Messiri";font-weight:700;src:url(../fonts/el-messiri-arabic-700-normal.woff2)}
@font-face{font-family:"Outfit";font-weight:500;src:url(../fonts/outfit-latin-500-normal.woff2)}
:root{--gold:#F9CF7A;--cream:#FFF6E0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#070A24}
canvas{position:absolute;inset:0}
#brand{position:absolute;top:208px;left:0;right:0;direction:ltr;color:var(--cream);opacity:.8;display:flex;gap:16px;justify-content:center;align-items:center}
#brand .ar{font:700 40px "Messiri";color:var(--gold)}
#brand .en{font:500 19px "Outfit";letter-spacing:.42em;margin-top:6px}
#brand .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:6px}
#rule{position:absolute;top:286px;left:50%;width:120px;margin-left:-60px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}
/* one text axis: Arabic sits in the upper band, English on a fixed baseline below the scene */
.ar{position:absolute;left:90px;right:90px;top:330px;height:330px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:var(--cream);
  font:700 80px/1.5 "Ruqaa";text-shadow:0 4px 30px rgba(6,8,30,.75),0 1px 4px rgba(6,8,30,.5)}
.ar.hero{top:360px;height:560px;font-size:118px;line-height:1.45}
.ar .g{color:var(--gold)}
.ar .p{font-family:"Amiri";font-weight:400;font-size:.8em}
.ar .s{font:400 46px/1.6 "Ruqaa";opacity:.92;margin-top:8px}
.en{position:absolute;left:110px;right:110px;top:1452px;height:150px;display:flex;justify-content:center;align-items:flex-start;text-align:center;direction:ltr;color:var(--cream);
  font:italic 500 45px/1.3 "Cormorant";opacity:.96;text-shadow:0 2px 18px rgba(6,8,30,.9)}
.src{position:absolute;left:0;right:0;top:1612px;text-align:center;font:500 28px/1.4 "Tajawal";color:var(--gold);opacity:.9;letter-spacing:.02em}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="brand"><span class="en2 en" style="position:static;height:auto;font:500 19px Outfit;letter-spacing:.42em;margin-top:6px;display:inline;text-shadow:none"></span><span class="dot"></span><span class="ar2 ar" style="position:static;height:auto;display:inline;font:700 40px Messiri;color:var(--gold);text-shadow:none"></span></div>
<div id="rule"></div>
<div id="caps"></div>
<script>
const params = new URLSearchParams(location.search);
const sc = document.createElement('script'); sc.src = '../episodes/' + (params.get('ep') || 'ep11') + '.js'; sc.onload = init; document.head.appendChild(sc);
const W = 1080, H = 1920, cv = document.getElementById('c'), ctx = cv.getContext('2d');
let EP, K, capEls = [];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
// three-way colour: dusk (tau 0) -> night (1) -> dawn (2)
function col3(a, b, c, tau, al = 1) { const A = hex(a), B = hex(b), C = hex(c), u = tau <= 1 ? tau : tau - 1, X = tau <= 1 ? A : B, Y = tau <= 1 ? B : C; return `rgba(${Math.round(lerp(X[0], Y[0], u))},${Math.round(lerp(X[1], Y[1], u))},${Math.round(lerp(X[2], Y[2], u))},${al})`; }
const R = rng(4), stars = Array.from({ length: 150 }, () => ({ x: R() * W, y: R() * 1050, r: 0.7 + R() * 2, p: R() * 6.3, s: 0.5 + R() * 1.7 }));
const motes = Array.from({ length: 60 }, () => ({ x: R() * W, y: 700 + R() * 700, s: 8 + R() * 22, r: 1.5 + R() * 3.5, p: R() * 6.3 }));
const ridge = x => 1262 + 30 * Math.sin(x / 300 + 0.8) + 12 * Math.sin(x / 110 + 2);     // the dune he stands on

function glow(x, y, r, a, c = '255,214,150') { if (a <= 0) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${c},${a})`); g.addColorStop(0.35, `rgba(${c},${a * 0.36})`); g.addColorStop(1, `rgba(${c},0)`); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.globalCompositeOperation = 'source-over'; }
function duneLayer(fn, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H); for (let x = 0; x <= W; x += 12) ctx.lineTo(x, fn(x)); ctx.lineTo(W, H); ctx.fill(); }

function tree(x, y, s, color) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineCap = 'round';
  ctx.lineWidth = 26; ctx.beginPath(); ctx.moveTo(8, 10); ctx.quadraticCurveTo(-18, -150, 26, -300); ctx.stroke();
  ctx.lineWidth = 15; ctx.beginPath(); ctx.moveTo(4, -190); ctx.quadraticCurveTo(-70, -260, -150, -318); ctx.moveTo(20, -250); ctx.quadraticCurveTo(110, -300, 190, -330); ctx.moveTo(22, -290); ctx.quadraticCurveTo(10, -340, -20, -372); ctx.stroke();
  for (const [ex, ey, rx, ry] of [[-150, -350, 170, 46], [60, -392, 230, 52], [210, -356, 150, 40], [-20, -420, 150, 40], [130, -430, 120, 34]]) { ctx.beginPath(); ctx.ellipse(ex, ey, rx, ry, 0, 0, 6.3); ctx.fill(); }
  ctx.restore(); }

// camel in silhouette, facing left. ph drives the legs, mv 0..1 is how much it is walking.
function camel(x, y, s, ph, mv, a, color, load) { if (a <= 0) return; ctx.save(); ctx.translate(x, y - Math.abs(Math.sin(ph)) * 5 * mv * s); ctx.scale(s, s); ctx.globalAlpha = a; ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  [[-66, 0], [-40, 3.14], [44, 3.14], [70, 0]].forEach(([bx, off]) => { const an = Math.sin(ph + off) * 0.34 * mv, kx = bx + Math.sin(an) * 62, ky = -118 + Math.cos(an) * 62, fx = kx + Math.sin(an * 0.35 - 0.12 * mv) * 62; ctx.lineWidth = 17; ctx.beginPath(); ctx.moveTo(bx, -122); ctx.lineTo(kx, ky); ctx.lineTo(fx, 0); ctx.stroke(); });
  ctx.beginPath(); ctx.ellipse(0, -156, 100, 48, 0, 0, 6.3); ctx.fill(); ctx.beginPath(); ctx.ellipse(2, -206, 50, 40, 0, 0, 6.3); ctx.fill();
  const nod = Math.sin(ph * 2) * 6 * mv; ctx.lineWidth = 34; ctx.beginPath(); ctx.moveTo(-78, -164); ctx.quadraticCurveTo(-134, -176, -146, -262 + nod); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-170, -276 + nod, 38, 19, 0.22, 0, 6.3); ctx.fill(); ctx.beginPath(); ctx.moveTo(-150, -292 + nod); ctx.lineTo(-140, -318 + nod); ctx.lineTo(-130, -290 + nod); ctx.fill();
  ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(96, -166); ctx.quadraticCurveTo(122, -146, 112, -104 + Math.sin(ph) * 8 * mv); ctx.stroke();
  if (load > 0) { ctx.globalAlpha = a * load; ctx.beginPath(); ctx.roundRect(-52, -250, 108, 40, 14); ctx.fill(); ctx.beginPath(); ctx.ellipse(46, -178, 22, 30, 0.2, 0, 6.3); ctx.fill(); ctx.beginPath(); ctx.ellipse(-46, -180, 20, 27, -0.2, 0, 6.3); ctx.fill(); }
  ctx.restore(); ctx.globalAlpha = 1; return [x - 190 * s, y - (276) * s]; }

// man in silhouette, facing left. bow 0..1 lowers the head, lie 0..1 lays him down (head to the right).
function man(x, y, s, bow, lie, a, color, ph = 0, mv = 0) { if (a <= 0) return; ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.translate(0, -lie * 40); ctx.rotate(lie * 1.5); ctx.globalAlpha = a; ctx.fillStyle = color;
  const sw = Math.sin(ph) * 8 * mv;
  ctx.beginPath(); ctx.moveTo(-36 + sw, 0); ctx.quadraticCurveTo(-44, -96, -24, -156); ctx.lineTo(24, -156); ctx.quadraticCurveTo(44, -96, 38 - sw, 0); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.translate(0, -150); ctx.rotate(-bow * 0.42); ctx.beginPath(); ctx.arc(-3, -30, 25, 0, 6.3); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-30, -38); ctx.quadraticCurveTo(-6, -66, 24, -44); ctx.quadraticCurveTo(36, -10, 44, 22); ctx.lineTo(4, 8); ctx.closePath(); ctx.fill(); ctx.restore();
  ctx.restore(); ctx.globalAlpha = 1; return [x - 30 * s, y - 100 * s]; }

function render(t) {
  const v = K.voiceAt, T = k => v + K[k];
  // time of day: dusk until he loses it, night while he despairs, dawn when it returns
  const tau = ss(T('infalatat') + 0.4, T('idtajaa') + 1.2, t) + ss(T('baina') - 0.2, T('qaima') + 1.4, t);
  const night = 1 - Math.abs(tau - 1), dawn = clamp(tau - 1), dusk = clamp(1 - tau);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const sky = ctx.createLinearGradient(0, 0, 0, 1320); sky.addColorStop(0, col3('#2A2C6C', '#050720', '#34397E', tau)); sky.addColorStop(0.5, col3('#8E5F8E', '#0C1140', '#B98AA6', tau)); sky.addColorStop(0.8, col3('#E79A7C', '#161B56', '#F3B08A', tau)); sky.addColorStop(1, col3('#F8C481', '#222868', '#FFE0A6', tau));
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // slow, steady push-in; nothing jolts
  const z = 1 + 0.07 * (t / EP.duration), cx = 560, cy = 1080; ctx.setTransform(z, 0, 0, z, cx * (1 - z), cy * (1 - z));
  for (const s of stars) { ctx.globalAlpha = (0.5 + 0.5 * Math.sin(t * s.s + s.p)) * Math.max(0, night - 0.15) * (1 - s.y / 1200); ctx.fillStyle = '#FFF6E0'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.3); ctx.fill(); } ctx.globalAlpha = 1;
  if (night > 0.1) { const ma = ss(0.1, 0.9, night), mx = 820, my = 760; glow(mx, my, 190, 0.2 * ma, '255,240,205'); ctx.save(); ctx.globalAlpha = ma; ctx.beginPath(); ctx.arc(mx, my, 40, 0, 6.3); ctx.arc(mx - 17, my - 8, 35, 0, 6.3, true); ctx.fillStyle = '#FFF1C8'; ctx.fill('evenodd'); ctx.restore(); }
  // the sun: sets on the left at dusk, rises there again at dawn
  const sunY = dusk > 0 ? lerp(1160, 1330, 1 - dusk) : lerp(1340, 1090, ss(0, 1, dawn)), sunA = Math.max(dusk, dawn);
  if (sunA > 0.01) { glow(250, sunY, 760, 0.55 * sunA, '255,206,140'); glow(250, sunY, 300, 0.7 * sunA, '255,232,180'); ctx.globalAlpha = sunA; ctx.fillStyle = '#FFF0C4'; ctx.beginPath(); ctx.arc(250, sunY, 74, 0, 6.3); ctx.fill(); ctx.globalAlpha = 1; }
  duneLayer(x => 1150 + 34 * Math.sin(x / 420 + 2.4) + 10 * Math.sin(x / 150), col3('#B5708A', '#111646', '#C98F9E', tau));
  duneLayer(x => 1205 + 28 * Math.sin(x / 340 + 4.2) + 9 * Math.sin(x / 120 + 1), col3('#8A4F78', '#151A52', '#A66D8C', tau));
  const sil = col3('#2C1A45', '#05061C', '#3A2450', tau);
  duneLayer(ridge, col3('#55305F', '#1B2162', '#6B3F6C', tau));
  // long soft light across the near dune
  if (sunA > 0) { const lg = ctx.createLinearGradient(0, 1240, 0, 1500); lg.addColorStop(0, `rgba(255,200,140,${0.22 * sunA})`); lg.addColorStop(1, 'rgba(255,200,140,0)'); ctx.fillStyle = lg; ctx.fillRect(0, 1230, W, 300); }

  if (night > 0.2) glow(700, 1250, 420, 0.1 * night, '190,205,255');
  const TX = 770; tree(TX, ridge(TX) + 6, 1.0, sil);
  // ── the story
  const arrive = ss(T('ahadikum') - 0.2, T('falat') + 0.4, t);                 // riding in from the right
  const bolt = ss(T('infalatat'), T('infalatat') + 2.6, t);                     // it slips away
  const back = ss(T('idha') - 0.3, T('qaima') + 0.2, t);                        // and there it is, standing by him
  const ridden = arrive < 1 || bolt <= 0;
  let camX, camA, camMv, camS = 0.92;
  if (back > 0) { camX = lerp(250, 470, back); camA = ss(T('idha') - 0.3, T('idha') + 0.7, t); camMv = 1 - ss(0.8, 1, back); }
  else { camX = lerp(1280, 500, arrive) - bolt * bolt * 900; camA = 1 - ss(0.75, 1, bolt); camMv = bolt > 0 ? 1.9 : (arrive < 1 ? 1 : 0); camS = 0.92 - 0.2 * bolt; }
  const appear = ss(T('ahadikum') - 0.3, T('ahadikum') + 0.5, t);
  const walkToTree = ss(T('ata') - 0.1, T('idtajaa') - 0.2, t), lie = ss(T('idtajaa') - 0.2, T('idtajaa') + 1.0, t) - ss(T('qaima') - 0.2, T('qaima') + 0.9, t);
  const bowed = ss(T('ayisa') - 0.2, T('ayisa') + 0.6, t) * (1 - ss(T('qaima'), T('qaima') + 0.8, t));
  const leave = ss(T('mahma') + 0.2, EP.duration, t);                           // together again, walking on toward the light
  const manX = lerp(lerp(600, 690, walkToTree), 600, ss(T('qaima') + 0.6, T('mahma') + 0.4, t)) - leave * 190;
  if (bolt > 0 && bolt < 1) for (let i = 0; i < 7; i++) { const u = (bolt * 3 + i / 7) % 1; glow(camX + 150 + i * 30 + u * 60, ridge(camX) - 10 - u * 40, 46 + u * 40, 0.16 * (1 - u) * (1 - bolt), '255,225,190'); }
  const camY = ridge(camX) + 4, lx = back > 0 ? camX - leave * 190 : camX;
  const head = camel(lx, ridge(lx) + 4, camS, (back > 0 ? t * 3.2 : t * (bolt > 0 ? 13 : 5.2)), back > 0 ? Math.max(camMv, leave > 0.02 ? 0.8 : 0) : camMv, camA * appear, sil, 1);
  if (ridden && appear > 0) man(camX + 4, camY - 190 * camS, 0.62, 0, 0, appear, sil);
  else if (!ridden || back > 0) { const hand = man(manX, ridge(manX) + 4, 0.88, bowed, lie, 1, sil, t * 6, (walkToTree > 0 && walkToTree < 1) || leave > 0.02 ? 1 : 0);
    if (back > 0 && lie < 0.1 && head) { const k = ss(T('qaima') + 0.5, T('qaima') + 1.2, t); if (k > 0) { ctx.globalAlpha = k; ctx.strokeStyle = sil; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(hand[0], hand[1]); ctx.quadraticCurveTo((hand[0] + head[0]) / 2, hand[1] + 46, head[0] + 18, head[1] + 26); ctx.stroke(); ctx.globalAlpha = 1; } } }
  // warm bloom as joy returns
  if (dawn > 0) glow(520, 1080, 900, 0.22 * dawn, '255,214,150');
  ctx.globalCompositeOperation = 'lighter'; for (const m of motes) { const yy = m.y - ((t * m.s) % 500), a = (0.1 + 0.5 * dawn) * (0.5 + 0.5 * Math.sin(t * 1.3 + m.p)); if (a <= 0) continue; ctx.fillStyle = `rgba(255,224,170,${a * 0.6})`; ctx.beginPath(); ctx.arc(m.x + Math.sin(t * 0.6 + m.p) * 18, yy, m.r, 0, 6.3); ctx.fill(); } ctx.globalCompositeOperation = 'source-over';

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // readable text: soft scrims top and bottom, and a deeper veil while the big statements are on screen
  const hero = (1 - ss(T('ahadikum') - 0.7, T('ahadikum') - 0.1, t)) + ss(T('mahma') - 0.2, T('mahma') + 0.5, t) * 0.55;
  if (hero > 0) { ctx.fillStyle = `rgba(8,9,34,${0.5 * hero})`; ctx.fillRect(0, 0, W, H); if (t < T('ahadikum')) glow(540, 640, 620, 0.18 * hero * ss(T('lallahu') - 0.2, T('lallahu') + 0.8, t)); }
  const tg = ctx.createLinearGradient(0, 0, 0, 820); tg.addColorStop(0, 'rgba(6,8,30,.6)'); tg.addColorStop(1, 'rgba(6,8,30,0)'); ctx.fillStyle = tg; ctx.fillRect(0, 0, W, 820);
  const bgr = ctx.createLinearGradient(0, 1330, 0, H); bgr.addColorStop(0, 'rgba(6,8,30,0)'); bgr.addColorStop(0.3, 'rgba(6,8,30,.55)'); bgr.addColorStop(1, 'rgba(6,8,30,.9)'); ctx.fillStyle = bgr; ctx.fillRect(0, 1330, W, H - 1330);
  const f = 1 - ss(0, 0.5, t) + ss(EP.duration - 0.7, EP.duration, t); if (f > 0) { ctx.fillStyle = `rgba(5,7,28,${f})`; ctx.fillRect(0, 0, W, H); }
  for (const c of capEls) { const o = ss(c.t0, c.t0 + 0.4, t) * (1 - ss(c.t1 - 0.35, c.t1, t)); c.el.style.opacity = o * (c.op || 1); c.el.style.visibility = o > 0.001 ? 'visible' : 'hidden'; c.el.style.transform = `translateY(${(1 - ss(c.t0, c.t0 + 0.6, t)) * 16}px)`; }
  document.getElementById('brand').style.opacity = 0.8 * (1 - f); document.getElementById('rule').style.opacity = 0.7 * (1 - f);
}
async function init() {
  EP = window.EPISODE; K = EP.keys;
  document.querySelector('#brand .ar2').textContent = EP.brand.ar; document.querySelector('#brand .en2').textContent = EP.brand.en;
  const caps = document.getElementById('caps');
  for (const c of EP.caps) { const el = document.createElement('div'); el.className = c.cls; el.innerHTML = '<div>' + c.html + '</div>'; caps.appendChild(el); capEls.push({ ...c, el }); }
  await document.fonts.ready; await Promise.all([...document.fonts].map(f => f.load().catch(() => {})));
  window.renderAt = render; window.READY = true;
  if (params.has('play')) { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % EP.duration); requestAnimationFrame(loop); })(); } else render(parseFloat(params.get('t') || '0'));
}
</script>
</body>
</html>
