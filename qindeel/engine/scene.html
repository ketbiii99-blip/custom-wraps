<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Messiri";font-weight:500;src:url(../fonts/el-messiri-arabic-500-normal.woff2)}
@font-face{font-family:"Messiri";font-weight:700;src:url(../fonts/el-messiri-arabic-700-normal.woff2)}
@font-face{font-family:"Amiri";font-weight:400;src:url(../fonts/amiri-arabic-400-normal.woff2)}
@font-face{font-family:"Amiri";font-weight:700;src:url(../fonts/amiri-arabic-700-normal.woff2)}
@font-face{font-family:"AmiriQuran";font-weight:400;src:url(../fonts/amiri-quran-arabic-400-normal.woff2)}
@font-face{font-family:"Plex";font-weight:400;src:url(../fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2)}
@font-face{font-family:"Plex";font-weight:500;src:url(../fonts/ibm-plex-sans-arabic-arabic-500-normal.woff2)}
@font-face{font-family:"Outfit";font-weight:400;src:url(../fonts/outfit-latin-400-normal.woff2)}
@font-face{font-family:"Outfit";font-weight:500;src:url(../fonts/outfit-latin-500-normal.woff2)}
@font-face{font-family:"Outfit";font-weight:600;src:url(../fonts/outfit-latin-600-normal.woff2)}
:root{--gold:#F7C56B;--cream:#FFF4DC}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#070B24}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
canvas{position:absolute;inset:0}
#brand{position:absolute;top:212px;left:0;right:0;text-align:center;direction:ltr;
  color:var(--cream);opacity:.78;display:flex;gap:16px;justify-content:center;align-items:center}
#brand .ar{font:700 40px "Messiri";color:var(--gold)}
#brand .en{font:500 19px "Outfit";letter-spacing:.42em;margin-top:6px}
#brand .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:6px}
.cue{position:absolute;top:320px;left:70px;right:70px;text-align:center;color:var(--cream);
  text-shadow:0 3px 22px rgba(4,6,24,.85),0 1px 3px rgba(4,6,24,.6)}
.cue.card{top:310px;left:64px;right:64px;padding:44px 44px 40px;border-radius:34px;
  background:linear-gradient(180deg,rgba(9,12,40,.72),rgba(9,12,40,.5));
  border:2px solid rgba(247,197,107,.55);box-shadow:0 20px 70px rgba(3,5,20,.45)}
.cue.card::before{content:"";position:absolute;top:-17px;left:50%;width:30px;height:30px;margin-left:-15px;
  background:var(--gold);transform:rotate(45deg);box-shadow:0 0 24px rgba(247,197,107,.7)}
.cue.card::after{content:"";position:absolute;top:-17px;left:50%;width:30px;height:30px;margin-left:-15px;background:var(--gold)}
.line{will-change:transform,opacity}
.gold{color:var(--gold)}
.big{font:700 92px/1.42 "Messiri";margin-bottom:14px}
.mid{font:700 76px/1.45 "Messiri";margin-bottom:16px}
.small{font:500 50px/1.6 "Plex";opacity:.95;margin-top:10px}
.label{font:700 44px/1.5 "Messiri";color:var(--gold);margin-bottom:14px}
.pbuh{font-family:"Amiri";font-weight:400;font-size:1.15em}
.hadith{font:700 61px/1.78 "Amiri"}
.ayah{font:400 68px/2.05 "AmiriQuran";color:var(--gold);margin-top:8px}
.source{font:400 32px/1.5 "Plex";opacity:.82;margin-top:20px;letter-spacing:.01em}
.follow{font:500 38px/1.5 "Plex";margin-top:44px;display:inline-block;padding:14px 38px;border-radius:99px;
  border:2px solid rgba(247,197,107,.7);background:rgba(9,12,40,.55);text-shadow:none}
.follow b{font-family:"Messiri";color:var(--gold)}
.sub{position:absolute;top:1506px;left:90px;right:90px;text-align:center;direction:ltr;
  font:500 41px/1.34 "Outfit";color:#fff;text-shadow:0 2px 14px rgba(3,4,16,.95),0 0 3px rgba(3,4,16,.9)}
.sub small{display:block;font:400 27px/1.5 "Outfit";letter-spacing:.07em;color:var(--gold);margin-top:8px;text-transform:uppercase}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="brand"><span class="en"></span><span class="dot"></span><span class="ar"></span></div>
  <div id="cues"></div>
  <div id="subs"></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const epScript = document.createElement('script');
epScript.src = '../episodes/' + (params.get('ep') || 'ep01') + '.js';
epScript.onload = init;
document.head.appendChild(epScript);

const W = 1080, H = 1920, GY = 1330, CX = 590, V = 165;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let EP, cueEls = [], subEls = [];

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function mix(a, b, t, al = 1) { const A = hex(a), B = hex(b); return `rgba(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))},${al})`; }
const mod = (x, m) => ((x % m) + m) % m;

/* ---------- motion ---------- */
function speed(t) { const a = EP.action; return 1 - ss(a.stopAt - 0.7, a.stopAt, t) + ss(a.resumeAt, a.resumeAt + 0.8, t); }
function dist(t) { let d = 0; const dt = 1 / 120; for (let x = 0; x < t; x += dt) d += V * speed(x) * dt; return d; }

/* ---------- pre-generated world ---------- */
const R = rng(7);
const stars = Array.from({ length: 170 }, () => ({ x: R() * W, y: R() * 1080, r: 0.8 + R() * 2.1, p: R() * 6.28, s: 0.6 + R() * 1.8 }));
const CITY_W = 1700;
const city = (() => { const r = rng(21), out = []; let x = 0; while (x < CITY_W - 60) { const k = r(); let w, h, type;
    if (k < 0.16) { w = 30; h = 300 + r() * 110; type = 'minaret'; } else if (k < 0.42) { w = 120 + r() * 70; h = 120 + r() * 70; type = 'dome'; } else { w = 70 + r() * 90; h = 70 + r() * 150; type = 'box'; }
    const wins = []; if (type !== 'minaret') { const n = Math.floor(r() * 4); for (let i = 0; i < n; i++) wins.push({ x: 12 + r() * (w - 30), y: 18 + r() * (h - 40), p: r() * 6 }); }
    out.push({ x, w, h, type, wins }); x += w + (r() < 0.3 ? 8 + r() * 30 : 0); } return out; })();
const PALM_W = 1500;
const palms = (() => { const r = rng(5); return [140, 520, 720, 1180].map(x => ({ x, h: 250 + r() * 170, lean: (r() - 0.5) * 60, s: 0.8 + r() * 0.45 })); })();
const GROUND_W = 1300;
const stones = (() => { const r = rng(99); return Array.from({ length: 26 }, () => ({ x: r() * GROUND_W, y: GY + 4 + r() * 90, w: 6 + r() * 16, t: r() })); })();
const tufts = (() => { const r = rng(3); return Array.from({ length: 12 }, () => ({ x: r() * GROUND_W, y: r() < 0.5 ? GY - 14 - r() * 10 : GY + 112 + r() * 24, s: 0.7 + r() * 0.8 })); })();
const FG_W = 1500;
const fg = (() => { const r = rng(44); return Array.from({ length: 9 }, () => ({ x: r() * FG_W, w: 180 + r() * 220, h: 70 + r() * 90 })); })();
const motes = (() => { const r = rng(77); return Array.from({ length: 46 }, () => ({ a: r() * 6.28, d: 20 + r() * 150, sp: 50 + r() * 110, dl: r() * 5.5, life: 2.2 + r() * 2.2, r: 2 + r() * 4, wob: r() * 6 })); })();

/* ---------- drawing ---------- */
function drawSky(t, d) {
  const g = ctx.createLinearGradient(0, 0, 0, GY);
  g.addColorStop(0, mix('#050821', '#27306F', d));
  g.addColorStop(0.5, mix('#101748', '#8D6FA6', d));
  g.addColorStop(0.82, mix('#1E2260', '#F0A08A', d));
  g.addColorStop(1, mix('#2B2A6C', '#FBD08C', d));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, GY + 10);
  // stars
  for (const s of stars) { const tw = 0.55 + 0.45 * Math.sin(t * s.s + s.p); ctx.globalAlpha = tw * (1 - d) * (1 - s.y / 1300); ctx.fillStyle = '#FFF4DC'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.3); ctx.fill(); }
  ctx.globalAlpha = 1;
  // crescent
  const ma = 1 - d * 0.75, mx = 905, my = GY - 470;
  const halo = ctx.createRadialGradient(mx, my, 10, mx, my, 170); halo.addColorStop(0, `rgba(255,236,190,${0.22 * ma})`); halo.addColorStop(1, 'rgba(255,236,190,0)');
  ctx.fillStyle = halo; ctx.fillRect(mx - 180, my - 180, 360, 360);
  ctx.save(); ctx.globalAlpha = ma; ctx.beginPath(); ctx.arc(mx, my, 44, 0, 6.3); ctx.arc(mx - 19, my - 9, 39, 0, 6.3, true); ctx.fillStyle = '#FFEFC4'; ctx.fill('evenodd'); ctx.restore();
  // dawn sun glow (the direction he is walking toward)
  if (d > 0) { const sx = 150, sy = GY - 70 - d * 60; const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 760);
    sg.addColorStop(0, `rgba(255,232,170,${0.95 * d})`); sg.addColorStop(0.12, `rgba(255,205,130,${0.6 * d})`); sg.addColorStop(0.45, `rgba(255,160,120,${0.2 * d})`); sg.addColorStop(1, 'rgba(255,160,120,0)');
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = sg; ctx.fillRect(0, 0, W, GY); ctx.globalCompositeOperation = 'source-over'; }
}
function dune(base, amp, k, ph, off, color) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 12) { const wx = x - off; ctx.lineTo(x, base + amp * Math.sin(wx / k + ph) + amp * 0.35 * Math.sin(wx / (k * 0.37) + ph * 2.1)); }
  ctx.lineTo(W, H); ctx.fill();
}
function drawCity(t, D, d) {
  const off = mod(D * 0.1, CITY_W), by = GY - 96, col = mix('#141949', '#7B6AA3', d);
  for (let rep = -1; rep <= 0; rep++) for (const b of city) {
    const x = b.x + off + rep * CITY_W; if (x > W + 50 || x + b.w < -50) continue;
    ctx.fillStyle = col;
    if (b.type === 'minaret') { ctx.fillRect(x, by - b.h, b.w, b.h); ctx.fillRect(x - 7, by - b.h * 0.72, b.w + 14, 10); ctx.fillRect(x - 5, by - b.h + 26, b.w + 10, 8);
      ctx.beginPath(); ctx.moveTo(x - 2, by - b.h); ctx.lineTo(x + b.w / 2, by - b.h - 52); ctx.lineTo(x + b.w + 2, by - b.h); ctx.fill();
      ctx.fillRect(x + b.w / 2 - 1.5, by - b.h - 70, 3, 20); }
    else { ctx.fillRect(x, by - b.h, b.w, b.h + 4);
      if (b.type === 'dome') { const r = b.w * 0.33, cx = x + b.w / 2; ctx.beginPath(); ctx.arc(cx, by - b.h, r, Math.PI, 0); ctx.fill();
        ctx.beginPath(); ctx.moveTo(cx - r * 0.5, by - b.h - r * 0.8); ctx.quadraticCurveTo(cx, by - b.h - r * 1.75, cx + r * 0.5, by - b.h - r * 0.8); ctx.fill(); ctx.fillRect(cx - 1.5, by - b.h - r * 1.5 - 14, 3, 18); }
      else if (b.w > 120) { for (let i = 0; i < 4; i++) ctx.fillRect(x + i * (b.w / 4) + 4, by - b.h - 10, b.w / 8, 10); } }
    for (const w of b.wins) { ctx.fillStyle = `rgba(255,196,110,${(0.55 + 0.25 * Math.sin(t * 1.3 + w.p)) * (1 - d * 0.9)})`; ctx.fillRect(x + w.x, by - b.h + w.y, 7, 12); }
  }
}
function drawPalms(t, D, d) {
  const off = mod(D * 0.42, PALM_W), col = mix('#080B28', '#4A3260', d);
  for (let rep = -1; rep <= 0; rep++) for (const p of palms) {
    const x = p.x + off + rep * PALM_W; if (x > W + 260 || x < -260) continue;
    const by = GY - 22, tx = x + p.lean, ty = by - p.h;
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineCap = 'round'; ctx.lineWidth = 17 * p.s;
    ctx.beginPath(); ctx.moveTo(x, by + 6); ctx.quadraticCurveTo(x - p.lean * 0.3, by - p.h * 0.55, tx, ty); ctx.stroke();
    const sway = Math.sin(t * 0.9 + p.x) * 0.045;
    for (let i = 0; i < 9; i++) { const a = -Math.PI * (0.02 + i / 8 * 0.96) + sway, L = (140 + (i % 3) * 22) * p.s, ex = tx + Math.cos(a) * L, ey = ty + Math.sin(a) * L * 0.62 + L * 0.42;
      const mx = tx + Math.cos(a) * L * 0.55, my = ty + Math.sin(a) * L * 0.9 - 24;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.quadraticCurveTo(mx, my, ex, ey); ctx.quadraticCurveTo(mx + 6, my + 30 * p.s, tx, ty + 8); ctx.fill(); }
    ctx.beginPath(); ctx.arc(tx, ty + 4, 13 * p.s, 0, 6.3); ctx.fill();
  }
}
function drawGround(D, d) {
  const g = ctx.createLinearGradient(0, GY - 30, 0, H); g.addColorStop(0, mix('#0C1034', '#5A3D63', d)); g.addColorStop(0.25, mix('#090C2A', '#3E2A4E', d)); g.addColorStop(1, mix('#04061A', '#1B132E', d));
  ctx.fillStyle = g; ctx.fillRect(0, GY - 30, W, H - GY + 30);
  // path
  const pg = ctx.createLinearGradient(0, GY - 8, 0, GY + 112); const pc = mix('#232A66', '#B98A80', d, 1), p0 = mix('#232A66', '#B98A80', d, 0);
  pg.addColorStop(0, p0); pg.addColorStop(0.18, pc); pg.addColorStop(0.8, pc); pg.addColorStop(1, p0);
  ctx.fillStyle = pg; ctx.fillRect(0, GY - 8, W, 120);
  const off = mod(D, GROUND_W);
  for (let rep = -1; rep <= 0; rep++) {
    for (const s of stones) { const x = s.x + off + rep * GROUND_W; if (x < -30 || x > W + 30) continue; ctx.fillStyle = mix('#151A4C', '#8C6468', d, 0.9); ctx.beginPath(); ctx.ellipse(x, s.y, s.w, s.w * 0.36, 0, 0, 6.3); ctx.fill(); }
    for (const tf of tufts) { const x = tf.x + off + rep * GROUND_W; if (x < -60 || x > W + 60) continue; ctx.strokeStyle = mix('#0A0E30', '#3A2848', d); ctx.lineWidth = 4; ctx.lineCap = 'round';
      for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(x + i * 4, tf.y + 6); ctx.quadraticCurveTo(x + i * 7, tf.y - 16 * tf.s, x + i * 12 * tf.s, tf.y - 30 * tf.s + Math.abs(i) * 5); ctx.stroke(); } }
  }
}
function drawBranch(x, y, rot, d, lit) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = 'rgba(2,3,14,.35)'; ctx.beginPath(); ctx.ellipse(0, 12, 86, 9, 0, 0, 6.3); ctx.fill();
  ctx.strokeStyle = mix('#6B4A33', '#5A3A2A', d); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(-84, 6); ctx.quadraticCurveTo(-30, -16, 10, -2); ctx.quadraticCurveTo(50, 10, 86, -10); ctx.stroke();
  ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-28, -9); ctx.lineTo(-52, -38); ctx.moveTo(22, 0); ctx.lineTo(46, -32); ctx.moveTo(-58, -2); ctx.lineTo(-72, 22); ctx.stroke();
  ctx.lineWidth = 3.2; ctx.strokeStyle = mix('#C9A27A', '#8A6248', d * 0.5, 0.6 + 0.4 * lit);
  const th = [[-70, 2, -76, -14], [-48, -6, -42, -22], [-12, -10, -18, -27], [2, -3, 8, 14], [36, 5, 30, 22], [60, 1, 66, -17], [78, -7, 88, -22], [-44, -29, -58, -30], [-49, -34, -42, -47], [40, -24, 54, -22], [45, -31, 38, -44], [-66, 12, -80, 14], [-28, -4, -30, 12]];
  ctx.beginPath(); for (const q of th) { ctx.moveTo(q[0], q[1]); ctx.lineTo(q[2], q[3]); } ctx.stroke();
  ctx.restore();
}
function rot(px, py, ox, oy, a) { const c = Math.cos(a), s = Math.sin(a), x = px - ox, y = py - oy; return [ox + x * c - y * s, oy + x * s + y * c]; }
const COL = { thobe: '#F3E7CB', thobeSh: '#D9C7A2', cloak: '#B5523B', cloakSh: '#8E3B2B', skin: '#C8956D', ghutra: '#FAF1DC', agal: '#221A2B', shoe: '#3A2418' };
function drawLantern(hx, hy, glow, t, sw) {
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(sw);
  ctx.strokeStyle = '#3B2A1C'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 30); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 36, 8, Math.PI, 0); ctx.stroke();
  ctx.fillStyle = '#3B2A1C'; ctx.beginPath(); ctx.moveTo(-17, 50); ctx.lineTo(0, 34); ctx.lineTo(17, 50); ctx.fill();
  const fl = 0.86 + 0.14 * Math.sin(t * 9.1) * Math.sin(t * 5.3 + 1);
  const gg = ctx.createLinearGradient(0, 50, 0, 98); gg.addColorStop(0, `rgba(255,${Math.round(214 + 30 * glow)},${Math.round(130 + 80 * glow)},1)`); gg.addColorStop(1, `rgba(255,${Math.round(150 + 60 * glow)},60,1)`);
  ctx.fillStyle = gg; ctx.beginPath(); ctx.moveTo(-14, 50); ctx.lineTo(14, 50); ctx.lineTo(18, 74); ctx.lineTo(13, 98); ctx.lineTo(-13, 98); ctx.lineTo(-18, 74); ctx.closePath(); ctx.fill();
  ctx.fillStyle = `rgba(255,255,235,${0.75 * fl})`; ctx.beginPath(); ctx.ellipse(0, 78, 5, 11 * fl, 0, 0, 6.3); ctx.fill();
  ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, 50); ctx.lineTo(0, 98); ctx.moveTo(-18, 74); ctx.lineTo(18, 74); ctx.stroke();
  ctx.fillStyle = '#3B2A1C'; ctx.fillRect(-17, 96, 34, 8);
  ctx.restore();
  return [hx - Math.sin(sw) * 76, hy + Math.cos(sw) * 76];
}
function glowAt(x, y, radius, a, warm = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
  g.addColorStop(0, `rgba(255,${Math.round(205 + 25 * warm)},${Math.round(125 + 50 * warm)},${a})`); g.addColorStop(0.25, `rgba(255,190,105,${a * 0.42})`); g.addColorStop(0.6, `rgba(255,160,80,${a * 0.12})`); g.addColorStop(1, 'rgba(255,150,70,0)');
  ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2); ctx.globalCompositeOperation = 'source-over';
}
// Traveler faces LEFT. Local coords: feet at (0,0), y up is negative. Returns lantern light position (stage coords).
function drawTraveler(x, y, S, ph, mv, bend, reach, glow, t) {
  const bob = Math.abs(Math.sin(ph)) * 7 * mv, crouch = bend * 34;
  ctx.save(); ctx.translate(x, y); ctx.scale(S, S);
  // shadow
  ctx.fillStyle = 'rgba(2,3,14,.45)'; ctx.beginPath(); ctx.ellipse(-4, 4, 74 + bend * 24, 11, 0, 0, 6.3); ctx.fill();
  // feet
  for (const k of [1, -1]) { const fx = Math.sin(ph) * 30 * k * mv - 6, lift = Math.max(0, Math.cos(ph) * k) * 12 * mv;
    ctx.fillStyle = COL.shoe; ctx.beginPath(); ctx.ellipse(fx - 8, -5 - lift, 20, 8, -0.08, 0, 6.3); ctx.fill(); }
  ctx.translate(0, crouch - bob);
  const a = -bend * 0.82, HIP = [2, -128];
  // lower thobe
  const hs = Math.sin(ph) * 9 * mv;
  ctx.fillStyle = COL.thobe; ctx.beginPath(); ctx.moveTo(-36, -150); ctx.lineTo(38, -150);
  ctx.quadraticCurveTo(50, -80, 50 + hs * 0.5, -14 - crouch + bob); ctx.quadraticCurveTo(0, -4 - crouch + bob, -48 + hs, -14 - crouch + bob); ctx.quadraticCurveTo(-44, -80, -36, -150); ctx.fill();
  ctx.fillStyle = COL.thobeSh; ctx.beginPath(); ctx.moveTo(14, -150); ctx.lineTo(38, -150); ctx.quadraticCurveTo(50, -80, 50 + hs * 0.5, -14 - crouch + bob); ctx.quadraticCurveTo(34, -8 - crouch + bob, 20, -8 - crouch + bob); ctx.quadraticCurveTo(26, -80, 14, -150); ctx.fill();
  // upper body (rotates about hip when bending)
  ctx.save(); ctx.translate(HIP[0], HIP[1]); ctx.rotate(a); ctx.translate(-HIP[0], -HIP[1]);
  // back arm reaching
  const SH_B = [10, -222];
  if (reach) { // reach target is in local unrotated coords -> convert into rotated frame
    const [rx, ry] = rot(reach[0], reach[1] - (crouch - bob), HIP[0], HIP[1], -a);
    ctx.strokeStyle = COL.thobeSh; ctx.lineWidth = 24; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(SH_B[0], SH_B[1]); ctx.quadraticCurveTo((SH_B[0] + rx) / 2 + 22, (SH_B[1] + ry) / 2, rx, ry); ctx.stroke();
    ctx.fillStyle = COL.skin; ctx.beginPath(); ctx.arc(rx, ry, 11, 0, 6.3); ctx.fill(); }
  // torso
  ctx.fillStyle = COL.thobe; ctx.beginPath(); ctx.moveTo(-36, -118); ctx.quadraticCurveTo(-42, -200, -24, -236); ctx.lineTo(28, -236); ctx.quadraticCurveTo(44, -200, 38, -118); ctx.quadraticCurveTo(0, -104, -36, -118); ctx.fill();
  // cloak over the back
  ctx.fillStyle = COL.cloak; ctx.beginPath(); ctx.moveTo(-6, -240); ctx.quadraticCurveTo(30, -246, 40, -226); ctx.quadraticCurveTo(62, -160, 58 + hs * 0.4, -92); ctx.quadraticCurveTo(34, -84, 12, -96); ctx.quadraticCurveTo(22, -170, -6, -240); ctx.fill();
  ctx.fillStyle = COL.cloakSh; ctx.beginPath(); ctx.moveTo(30, -236); ctx.quadraticCurveTo(62, -160, 58 + hs * 0.4, -92); ctx.quadraticCurveTo(48, -88, 40, -90); ctx.quadraticCurveTo(48, -170, 30, -236); ctx.fill();
  // head
  ctx.fillStyle = COL.skin; ctx.beginPath(); ctx.arc(-8, -266, 30, 0, 6.3); ctx.fill();
  ctx.fillStyle = COL.ghutra; ctx.beginPath(); ctx.moveTo(-36, -276); ctx.quadraticCurveTo(-30, -306, -2, -304); ctx.quadraticCurveTo(30, -302, 34, -268); ctx.quadraticCurveTo(40, -232, 48, -206); ctx.quadraticCurveTo(24, -202, 4, -220); ctx.quadraticCurveTo(-2, -252, -14, -272); ctx.quadraticCurveTo(-24, -280, -36, -276); ctx.fill();
  ctx.strokeStyle = COL.agal; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-31, -287); ctx.quadraticCurveTo(0, -300, 30, -284); ctx.stroke();
  // front arm with lantern
  const swing = Math.sin(ph) * 7 * mv, SH = [-10, -222], HAND = [-70 + swing, -168 + Math.abs(swing) * 0.3];
  ctx.strokeStyle = COL.thobe; ctx.lineWidth = 25; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(SH[0], SH[1]); ctx.quadraticCurveTo(-22, -176, HAND[0], HAND[1]); ctx.stroke();
  ctx.strokeStyle = COL.thobeSh; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(SH[0] + 8, SH[1] + 14); ctx.quadraticCurveTo(-14, -168, HAND[0] + 6, HAND[1] + 11); ctx.stroke();
  ctx.fillStyle = COL.skin; ctx.beginPath(); ctx.arc(HAND[0] - 2, HAND[1], 11, 0, 6.3); ctx.fill();
  ctx.restore();
  // lantern hangs straight down from the (rotated) hand
  const [hx, hy] = rot(HAND[0] - 2, HAND[1], HIP[0], HIP[1], a);
  const [lx, ly] = drawLantern(hx, hy + 6, glow, t, Math.sin(ph + 0.6) * 0.09 * mv + Math.sin(t * 1.7) * 0.02);
  ctx.restore();
  return [x + lx * S, y + (ly + crouch - bob) * S];
}
function drawFg(D, d) {
  const off = mod(D * 1.55, FG_W);
  ctx.fillStyle = mix('#02030F', '#120C22', d);
  for (let rep = -1; rep <= 0; rep++) for (const b of fg) { const x = b.x + off + rep * FG_W; if (x > W + 260 || x + b.w < -260) continue;
    ctx.beginPath(); ctx.ellipse(x, H - 40, b.w, b.h * 1.5, 0, Math.PI, 0); ctx.fill(); }
  const g = ctx.createLinearGradient(0, GY + 110, 0, H); g.addColorStop(0, 'rgba(3,4,18,0)'); g.addColorStop(0.4, 'rgba(3,4,18,.5)'); g.addColorStop(1, 'rgba(3,4,18,.72)');
  ctx.fillStyle = g; ctx.fillRect(0, GY + 110, W, H - GY - 110);
}

/* ---------- frame ---------- */
function render(t) {
  const A = EP.action, D = dist(t), d = ss(A.dawnFrom, A.dawnTo, t);
  ctx.clearRect(0, 0, W, H);
  drawSky(t, d);
  drawCity(t, D, d);
  dune(GY - 92, 26, 310, 1.3, D * 0.2, mix('#0E133D', '#77557F', d));
  dune(GY - 52, 20, 230, 4.1, D * 0.3, mix('#0B0F33', '#62426F', d));
  drawPalms(t, D, d);
  drawGround(D, d);

  // character state
  const mv = speed(t), ph = D / 34;
  const s0 = A.stopAt;
  const bend = ss(s0 + 0.15, s0 + 0.95, t) - ss(s0 + 1.95, s0 + 2.9, t);
  const carry = ss(s0 + 0.95, s0 + 1.95, t);            // branch being moved aside
  const reward = ss(s0 + 2.0, s0 + 3.6, t);              // lantern brightens
  const glow = 0.32 + 0.68 * reward;
  const cy = GY + 52, S = 1.22;

  // branch
  const bx0 = CX - 150 - dist(s0), bX = bx0 + D - carry * 36, bY = GY + 66 + carry * 54 - Math.sin(carry * Math.PI) * 40, bR = -0.12 + carry * 0.5;
  const branchFront = carry > 0.02;
  if (!branchFront) drawBranch(bX, bY, bR, d, glow);

  // lantern light on the world (before the figure so he is lit from it, then again on top)
  const lxE = CX - 88 * S, lyE = cy - 100 * S;
  const fl = 0.93 + 0.07 * Math.sin(t * 8.3) * Math.sin(t * 3.1);
  glowAt(lxE, lyE, 330 + 420 * reward, (0.34 + 0.4 * reward) * fl * (1 - d * 0.35));
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; const pool = ctx.createRadialGradient(0, 0, 0, 0, 0, 1); pool.addColorStop(0, `rgba(255,190,110,${(0.2 + 0.2 * reward) * fl})`); pool.addColorStop(1, 'rgba(255,190,110,0)');
  ctx.translate(lxE + 10, cy + 6); ctx.scale(250 + 200 * reward, 46 + 26 * reward); ctx.fillStyle = pool; ctx.beginPath(); ctx.arc(0, 0, 1, 0, 6.3); ctx.fill(); ctx.restore();

  const reachOn = ss(s0 + 0.35, s0 + 0.95, t) - ss(s0 + 1.95, s0 + 2.5, t);
  const reach = reachOn > 0.02 ? [lerp(34, (bX - CX) / S + 30, reachOn), lerp(-150, (bY - cy) / S - 12, reachOn)] : null;
  const [LX, LY] = drawTraveler(CX, cy, S, ph, mv, bend, reach, glow, t);
  if (branchFront) drawBranch(bX, bY, bR, d, glow);
  glowAt(LX, LY - 20, 120 + 90 * reward, (0.5 + 0.35 * reward) * fl);

  // reward: expanding ring + rising motes
  const rt = t - (s0 + 2.0);
  if (rt > 0 && rt < 2.2) { const k = rt / 2.2; ctx.strokeStyle = `rgba(255,214,140,${(1 - k) * 0.7})`; ctx.lineWidth = 5 * (1 - k) + 1; ctx.beginPath(); ctx.arc(LX, LY - 20, 40 + k * 640, 0, 6.3); ctx.stroke(); }
  if (rt > 0) { ctx.globalCompositeOperation = 'lighter';
    for (const m of motes) { const lt = mod(rt - m.dl, m.life + 1.4); if (rt < m.dl || lt > m.life) continue; const k = lt / m.life, fade = Math.sin(k * Math.PI) * (1 - ss(7, 10, rt));
      const px = LX + Math.cos(m.a) * m.d + Math.sin(lt * 2 + m.wob) * 16 + (D - dist(s0 + 2 + m.dl + Math.floor((rt - m.dl) / (m.life + 1.4)) * (m.life + 1.4))) * 1, py = LY - 20 + Math.sin(m.a) * m.d * 0.5 - lt * m.sp;
      ctx.fillStyle = `rgba(255,220,150,${fade * 0.85})`; ctx.beginPath(); ctx.arc(px, py, m.r, 0, 6.3); ctx.fill(); }
    ctx.globalCompositeOperation = 'source-over'; }

  drawFg(D, d);
  // vignette + top scrim for text
  const tg = ctx.createLinearGradient(0, 0, 0, 900); tg.addColorStop(0, `rgba(4,6,26,${0.55 - d * 0.1})`); tg.addColorStop(1, 'rgba(4,6,26,0)'); ctx.fillStyle = tg; ctx.fillRect(0, 0, W, 900);
  const vg = ctx.createRadialGradient(W / 2, H * 0.55, 500, W / 2, H * 0.55, 1250); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,10,.5)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // fade in / out for a soft loop
  const f = 1 - ss(0, 0.35, t) + ss(EP.duration - 0.45, EP.duration, t);
  if (f > 0) { ctx.fillStyle = `rgba(5,8,33,${f})`; ctx.fillRect(0, 0, W, H); }

  // text overlays
  for (const c of cueEls) { const out = 1 - ss(c.t1 - 0.35, c.t1, t); let any = 0;
    for (const l of c.lines) { const k = ss(c.t0 + l.at, c.t0 + l.at + 0.45, t), o = k * out; any = Math.max(any, o); l.el.style.opacity = o; l.el.style.transform = `translateY(${(1 - k) * 26}px)`; }
    c.el.style.visibility = any > 0.001 ? 'visible' : 'hidden';
    if (c.card) { const k = ss(c.t0, c.t0 + 0.5, t) * out; c.el.style.opacity = k; c.el.style.transform = `translateY(${(1 - ss(c.t0, c.t0 + 0.5, t)) * 30}px)`; } }
  for (const s of subEls) { const o = ss(s.t0, s.t0 + 0.18, t) * (1 - ss(s.t1 - 0.16, s.t1, t)); s.el.style.opacity = o; s.el.style.visibility = o > 0.001 ? 'visible' : 'hidden'; }
  document.getElementById('brand').style.opacity = 0.78 * (1 - f);
}

async function init() {
  EP = window.EPISODE;
  document.querySelector('#brand .ar').textContent = EP.brand.ar;
  document.querySelector('#brand .en').textContent = EP.brand.en;
  const cues = document.getElementById('cues'), subs = document.getElementById('subs');
  for (const c of EP.cues) { const el = document.createElement('div'); el.className = 'cue' + (c.card ? ' card' : ''); const lines = [];
    for (const l of c.lines) { const le = document.createElement('div'); le.className = 'line ' + l.cls; le.innerHTML = l.html; const wrap = document.createElement('div'); wrap.appendChild(le); el.appendChild(wrap); lines.push({ ...l, el: le }); }
    cues.appendChild(el); cueEls.push({ ...c, el, lines }); }
  for (const s of EP.subs) { const el = document.createElement('div'); el.className = 'sub'; el.innerHTML = s.text; subs.appendChild(el); subEls.push({ ...s, el }); }
  await document.fonts.ready;
  await Promise.all([...document.fonts].map(f => f.load().catch(() => {})));
  window.renderAt = render; window.READY = true;
  if (params.has('t')) render(parseFloat(params.get('t')));
  else if (params.has('play')) { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % EP.duration); requestAnimationFrame(loop); })(); }
  else render(0);
}
</script>
